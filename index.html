<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Taster-Rad</title>
<meta name="apple-mobile-web-app-title" content="Taster-Rad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="play">
  <div id="scene"></div>
  <div id="result" aria-live="polite"></div>
</main>
<div id="lockRing" hidden aria-hidden="true"></div>
<button id="gear" aria-label="Lehrkraft-Bereich öffnen (2 Sekunden halten)">
  <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</button>

<dialog id="menu">
  <section id="home">
    <div class="dialog-kopf"><h2>Kacheln</h2><button id="close" class="knopf">Fertig</button></div>
    <div id="tiles"></div>
    <details id="device">
      <summary>Gerät und Ansteuerung</summary>
      <div class="gruppe">
        <label class="wahl"><input type="checkbox" id="screenTap"> Bildschirm antippen (Touch)</label>
        <label class="wahl"><input type="checkbox" id="useSwitch"> Taster per Kabel-Adapter oder Bluetooth</label>
        <label>Auslösen <select id="trigger"><option value="press">beim Drücken</option><option value="release">beim Loslassen</option></select></label>
        <label class="wahl"><input type="checkbox" id="anyKey"> Jede Taste zählt</label>
        <button id="learn" class="knopf leise">Taste lernen</button>
        <p id="switchTest" class="test">Taster testen: einfach drücken.</p>
        <label>Sperrzeit ab dem Druck: <output id="lockOut"></output> <input type="range" id="lock" min="0" max="15" step="1"></label>
        <label class="wahl"><input type="checkbox" id="sound"> Töne</label>
        <label class="wahl"><input type="checkbox" id="speak"> Ergebnis vorlesen</label>
      </div>
    </details>
    <p id="offline" class="leise-text"></p>
    <p class="leise-text">© 2026 Walteroelf · Work in Progress · <a href="https://github.com/Walteroelf/taster-rad/blob/main/LICENSE.md" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a></p>
  </section>

  <section id="editor" hidden>
    <div class="dialog-kopf"><h2>Kachel bearbeiten</h2><button id="back" class="knopf">Zurück</button></div>
    <label>Name <input type="text" id="name" maxlength="24"></label>
    <fieldset><legend>1. Szene</legend><div class="auswahl" id="sceneChoice"></div></fieldset>
    <fieldset id="contentBox"><legend>2. Inhalt</legend>
      <label>Felder <select id="content"></select></label>
      <button id="newSet" class="knopf leise">Eigene Sammlung anlegen</button>
      <div id="own">
        <label>Name der Sammlung <input type="text" id="setName" maxlength="24"></label>
        <p class="leise-text">2 bis 26 Felder, mit Text oder Bild. Alles bleibt auf diesem Gerät.</p>
        <div id="fields"></div>
        <button id="addField" class="knopf leise">Feld dazu</button>
      </div>
    </fieldset>
    <fieldset><legend>3. Verhalten</legend><div class="auswahl" id="modeChoice"></div></fieldset>
    <details>
      <summary>Mehr</summary>
      <div class="gruppe">
        <label data-for="random">Dauer: <output id="durationOut"></output> <input type="range" id="duration" min="2" max="10" step="1"></label>
        <label data-for="rad">Innere Scheibe <select id="inner"></select></label>
        <label data-for="wuerfel">Anzahl Würfel <select id="count"><option>1</option><option>2</option><option>3</option></select></label>
        <label class="wahl" data-for="wuerfel"><input type="checkbox" id="sum"> Summe zeigen</label>
        <label class="wahl" data-for="licht"><input type="checkbox" id="names"> Namen unter den Bildern</label>
        <label class="wahl" data-for="rad licht"><input type="checkbox" id="skip"> Gezogene Felder auslassen</label>
      </div>
    </details>
    <div class="reihe">
      <button id="use" class="knopf gruen">Spielen</button>
      <button id="copy" class="knopf leise">Duplizieren</button>
      <button id="remove" class="knopf leise">Kachel löschen</button>
    </div>
  </section>
  <p id="message" role="status"></p>
</dialog>
<script src="js/szenen.js"></script>
<script src="js/app.js"></script>
</body>
</html>
